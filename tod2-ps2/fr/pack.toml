description = "Machine translated from the Japanese and not reviewed by a human translator. Partial, and in progress. In French so far: the whole story, the menu screens, the battle messages, the enemy names, the lists the menus read, all the skits with their titles, and four of the six quiz books with part of the fifth. Still the game's own Japanese: the rest of the fifth quiz book, the sixth and the minigames. With ventris 0.2.0 the battle messages and the field's place names are in the pack but the game still shows its Japanese for them. Only the opening, the first town, the first steps on the world map, three skits and the menu screens have been seen on screen; the rest has been built and checked by tools. NOTES.md says how far it goes, the names and terms chosen, and what has been seen on screen."

