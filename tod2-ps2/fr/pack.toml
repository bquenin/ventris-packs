description = "Machine translated from the Japanese and not reviewed by a human translator. In French: the whole story, the menu screens, the battle messages, the names of places on the field, the enemy names, the lists the menus read, all the skits with their titles, the six quiz books and the minigames, which is every string the English pack of this game writes. Still the game's own Japanese: the answers that five minigames have the player compose in kana, and two minigames that neither pack touches. Only the opening, the first town, the first steps on the world map, three skits, the menu screens and two questions of the quiz have been seen on screen; the rest has been built and checked by tools. NOTES.md says how far it goes, the names and terms chosen, and what has been seen on screen."

